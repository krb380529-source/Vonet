    <script>
        $(function() {
            $("form").submit(function() {
                return false;
            });
        });
        const Http = {
            post: function(url, data, callback) {
                var xhr = new XMLHttpRequest();
                xhr.open("POST", url, callback != undefined);
                xhr.setRequestHeader("Content-Type", "application/json");
                if (callback != undefined) {
                    xhr.onload = function() {
                        callback(xhr.responseText);
                    }
                }
                xhr.send(JSON.stringify(data));
                if (!callback) {
                    return xhr.responseText;
                }
            }
        }

        $("#registerbtn").click(function() {

            $("#registerbtn").attr("disabled", true);
            $("#registerbtn").html('<i class="fa fa-spinner fa-spin">  </i> Registering...');
            var email = $("#emailbox").val();
            var did = $("#didbox").val();
            var invite = $("#invitebox").val();
            if (email.length < 4 || did.length < 8 || invite.length < 8) {
                $("#alertmsg").hide();
                $("#successmsg").hide();
                setTimeout(() => {
                    $("#registerbtn").html('Register');
                    $("#registerbtn").removeAttr("disabled")
                    $("#alertmsg").text("Please fill all fields");
                    $("#alertmsg").fadeIn(350);
                }, 500);
                return;
            }
            if (!actuallyReadTos) {
                $("#alertmsg").hide();
                $("#successmsg").hide();
                setTimeout(() => {
                    $("#registerbtn").html('Register');
                    $("#registerbtn").removeAttr("disabled")
                    $("#alertmsg").text("Please read the ToS");
                    $("#alertmsg").fadeIn(350);
                }, 500);
                return;
            }
            // disable the button and show loading icon
            Http.post("auth/register.json", {
                email: email,
                discord_id: did,
                invite: invite
            }, function(response) {
                var data = JSON.parse(response);
                if (!data.success) {
                    $("#alertmsg").hide();
                    $("#registerbtn").html('Register');
                    $("#registerbtn").removeAttr("disabled")
                    $("#alertmsg").text(data.message)
                    $("#alertmsg").fadeIn(350);
                    return;
                }
                $("#registerbtn").html('<i class="fas fa-user-check">  </i> Registered');
                $("#registerbtn").removeClass("bg-gradient-info");
                $("#registerbtn").addClass("bg-gradient-success");
                $("#successmsg").text("Successfully registered! API key has been sent to your inbox. Check your spam folder if you don't see it.");
                $("#successmsg").fadeIn(350);
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 5000);
            });



        });
    </script>
